# Edge nginx -> avnac frontend container (which serves the SPA and proxies /api to backend).
# Both containers must share a docker network (e.g. `docker network create proxy`).
server {
  listen 80;
  server_name avnac.example.com;

  # Must match the inner nginx, otherwise uploads / AI calls die here first.
  client_max_body_size 50m;
  proxy_read_timeout 180s;

  # Docker DNS + variable: nginx still starts if the avnac container is down.
  resolver 127.0.0.11 valid=30s;
  set $avnac http://avnac-frontend-1:80;

  location / {
    proxy_pass $avnac;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
